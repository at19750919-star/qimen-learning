<meta charset="utf-8">
<title>五行圖排版器</title>
<style>
  :root{--paper:#f4efe4;--ink:#201f1b;--muted:#716b60;--line:#c8bda9;--red:#9d2821}
  *{box-sizing:border-box}
  body{margin:0;background:#2a2823;color:#e8e2d6;font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;height:100vh;overflow:hidden}
  #stageWrap{flex:1;overflow:auto;position:relative;padding:24px}
  #stageInner{display:grid;place-items:center;min-width:100%;min-height:100%}
  
  #stage{position:relative;background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.5);transform-origin:center}
  #bgLayer{position:absolute;inset:0;z-index:0;background:url("assets/wuxing-bg-sq.png") center/contain no-repeat;filter:var(--tone,none)}
  .el{position:absolute;z-index:2;cursor:move;user-select:none;white-space:nowrap;outline:1px dashed transparent;padding:2px}
  .el:hover{outline-color:rgba(157,40,33,.5)}
  .el.sel{outline:1px solid var(--red);background:rgba(157,40,33,.06)}
  .grp{display:flex;align-items:center;gap:.12em}
  .ch{font-family:IMing,serif;line-height:1}
  .gua{display:flex;flex-direction:column;justify-content:center}
  .gua .t{display:flex;flex-direction:column;gap:.22em;margin:.14em 0}
  .gua .bar{display:flex;gap:.18em;height:.085em}
  .gua .bar i{background:var(--ink);flex:1;display:block}
  .nt{white-space:nowrap;letter-spacing:.06em}
  .lst{font-family:IMing,serif;color:var(--ink);display:grid;grid-template-columns:auto 1fr;align-items:baseline}
  .lst b{color:var(--muted);font-weight:400}
  #guides{position:absolute;inset:0;pointer-events:none;z-index:1}
  aside{width:330px;background:#221f1a;border-left:1px solid #3d3830;padding:14px;overflow:auto}
  h3{margin:0 0 10px;font-size:15px;letter-spacing:.08em;color:#d8cdb8}
  .row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  button.stp{padding:2px 7px;line-height:1;min-width:26px}
  button{background:#3a342b;color:#e8e2d6;border:1px solid #554c3e;padding:6px 10px;cursor:pointer;font:inherit}
  button:hover{background:#4a4235}
  button.on{background:var(--red);border-color:var(--red);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  th,td{padding:3px 4px;border-bottom:1px solid #3d3830;text-align:right}
  th:first-child,td:first-child{text-align:left}
  thead th{color:#9a9081;font-weight:400}
  tr.sel td{background:rgba(157,40,33,.25)}
  input[type=range]{width:110px!important;vertical-align:middle}
  input,select{background:#18100e;color:#e8e2d6;border:1px solid #554c3e;padding:4px 6px;font:inherit}
  label{color:#9a9081;font-size:12px}
  textarea{width:100%;height:190px;background:#18100e;color:#cfc6b6;border:1px solid #3d3830;font:11px/1.4 Consolas,monospace;margin-top:6px}
  .hint{color:#9a9081;font-size:12px;margin:10px 0 4px}
  kbd{background:#3a342b;border:1px solid #554c3e;padding:0 5px;border-radius:3px;font:11px monospace}
</style>

<div id="stageWrap"><div id="stageInner"><div id="stage"><div id="bgLayer"></div><svg id="guides"></svg></div></div></div>

<aside>
  <h3>五行圖排版器</h3>
  <div class="row">
    <button id="bFit">縮放適應</button><button id="bZoomIn">＋</button><button id="bZoomOut">－</button><button id="bZoom100">100%</button>
  </div>
  <div class="row">
    <button id="bGuide" class="on">輔助線</button>
    <button id="bSnap" class="on">吸附</button>
    <button id="bList" class="on">顯示清單</button>
  </div>
  <div class="hint">
    拖曳移動・滾輪縮放・<kbd>↑↓←→</kbd> 微調 1px（<kbd>Shift</kbd>＝10px）<br>
    <kbd>[</kbd> <kbd>]</kbd> 縮放選中元素・<kbd>Esc</kbd> 取消選取
  </div>
  <table>
    <thead><tr><th>元素</th><th>x%</th><th>y%</th><th>字級%</th><th>距圓心</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div id="all" style="margin-top:12px;padding:10px;background:#2b261f;border:1px solid #3d3830">
    <div style="color:#d8cdb8;margin-bottom:8px">五組一起調</div>
    <div style="color:#d8cdb8;margin:10px 0 6px">顏色</div>
    <div class="row">
      <label style="width:66px">大字</label>
      <input type="color" id="c0" value="#49664d" title="木"><input type="color" id="c1" value="#9d2821" title="火">
      <input type="color" id="c2" value="#9b7a3d" title="土"><input type="color" id="c3" value="#201f1b" title="金">
      <input type="color" id="c4" value="#2d4870" title="水">
    </div>
    <div class="row"><label style="width:66px">標籤／成員</label>
      <input type="color" id="cLbl" value="#716b60"><input type="color" id="cVal" value="#201f1b">
      <input type="color" id="cGua" value="#201f1b" title="卦象">
    </div>
    <div style="color:#d8cdb8;margin:10px 0 6px">底圖色調</div>
    <div class="row"><label style="width:66px">飽和度</label><button class="stp" data-t="tSat" data-d="-1">－</button><input id="tSat" type="range" min="0" max="200" value="100" style="width:130px"><button class="stp" data-t="tSat" data-d="1">＋</button><span id="vSat" style="color:#9a9081">100%</span></div>
    <div class="row"><label style="width:66px">明度</label><button class="stp" data-t="tBri" data-d="-1">－</button><input id="tBri" type="range" min="50" max="150" value="100" style="width:130px"><button class="stp" data-t="tBri" data-d="1">＋</button><span id="vBri" style="color:#9a9081">100%</span></div>
    <div class="row"><label style="width:66px">透明度</label><button class="stp" data-t="tOpa" data-d="-1">－</button><input id="tOpa" type="range" min="10" max="100" value="100" style="width:130px"><button class="stp" data-t="tOpa" data-d="1">＋</button><span id="vOpa" style="color:#9a9081">100%</span></div>
    <div class="row"><label style="width:66px">羽化</label><button class="stp" data-t="tFea" data-d="-1">－</button><input id="tFea" type="range" min="0" max="300" value="0" style="width:130px"><button class="stp" data-t="tFea" data-d="1">＋</button><span id="vFea" style="color:#9a9081">0px</span></div>
    <div class="row"><label style="width:66px">色相</label><button class="stp" data-t="tHue" data-d="-1">－</button><input id="tHue" type="range" min="-60" max="60" value="0" style="width:130px"><button class="stp" data-t="tHue" data-d="1">＋</button><span id="vHue" style="color:#9a9081">0°</span></div>
    <div style="color:#d8cdb8;margin:10px 0 6px">字型</div>
    <div class="row"><label style="width:66px">大字字型</label><select id="aFontBig" style="width:150px"><option value="iming">I.明體</option><option value="swei-el">四季春 ExtraLight</option><option value="swei-lt">四季春 Light</option><option value="swei-rg">四季春 Regular</option><option value="swei-md">四季春 Medium</option><option value="swei-sb">四季春 SemiBold</option><option value="swei-bd">四季春 Bold</option><option value="swei-bk">四季春 Black</option><option value="sugar-lt">四季春加糖 Light</option><option value="sugar-rg">四季春加糖 Regular</option><option value="sugar-md">四季春加糖 Medium</option><option value="sugar-bd">四季春加糖 Bold</option><option value="kaiu">標楷體 DFKai-SB</option><option value="stkaiti">華文楷體 STKaiti</option><option value="xiangcui">香萃刻宋</option></select></div>
    <div class="row"><label style="width:66px">清單字型</label><select id="aFontList" style="width:150px"><option value="iming">I.明體</option><option value="swei-el">四季春 ExtraLight</option><option value="swei-lt">四季春 Light</option><option value="swei-rg">四季春 Regular</option><option value="swei-md">四季春 Medium</option><option value="swei-sb">四季春 SemiBold</option><option value="swei-bd">四季春 Bold</option><option value="swei-bk">四季春 Black</option><option value="sugar-lt">四季春加糖 Light</option><option value="sugar-rg">四季春加糖 Regular</option><option value="sugar-md">四季春加糖 Medium</option><option value="sugar-bd">四季春加糖 Bold</option><option value="kaiu">標楷體 DFKai-SB</option><option value="stkaiti">華文楷體 STKaiti</option><option value="xiangcui">香萃刻宋</option></select></div>
    <div class="row"><label style="width:66px">清單字級%</label><input id="aSize" type="number" step=".05" value="2.60" style="width:74px"></div>
    <div class="row"><label style="width:66px">註解字級%</label><input id="aNote" type="number" step=".05" value="2.20" style="width:74px"></div>
    <div class="row"><label style="width:66px">標籤字級%</label><input id="aLb" type="number" step=".05" value="2.10" style="width:74px"></div>
    <div class="row"><label style="width:66px">標籤字距</label><input id="aLls" type="number" step=".02" value="0" style="width:74px"><span style="color:#9a9081">em</span></div>
    <div class="row"><label style="width:66px">清單行距</label><input id="aLh" type="number" step=".05" value="1.45" style="width:74px"><span style="color:#9a9081">倍</span></div>
    <div class="row"><label style="width:66px">標籤間距</label><input id="aCg" type="number" step=".05" value="0.70" style="width:74px"><span style="color:#9a9081">em</span></div>
    <div class="row"><label style="width:66px">成員字距</label><input id="aLs" type="number" step=".02" value="0.16" style="width:74px"><span style="color:#9a9081">em</span></div>
    <div class="row"><label style="width:66px">分隔符號</label>
      <select id="aSep" style="width:112px">
        <option value="">無（靠字距分開）</option>
        <option value="　">全形空格</option>
        <option value="、">頓號</option>
      </select></div>
    <div class="row"><label style="width:66px">成員寫法</label>
      <select id="aAbbr" style="width:112px">
        <option value="1">簡寫（震・沖・傷）</option>
        <option value="0">全稱（震三・天沖・傷門）</option>
      </select></div>
    <div class="row"><label style="width:66px">大字字級%</label><input id="aBig" type="number" step=".05" value="7.00" style="width:74px"></div>
    <div class="row"><label style="width:66px">五邊形半徑</label><input id="aR" type="number" step="5" value="410" style="width:74px"><span style="color:#9a9081">px</span></div>
  </div>
  <div id="pane" style="display:none;margin-top:12px;padding:10px;background:#2b261f;border:1px solid #3d3830">
    <div style="color:#d8cdb8;margin-bottom:8px" id="paneName"></div>
    <div class="row"><label style="width:52px">字級%</label><input id="iSize" type="number" step=".05" style="width:78px"></div>
    <div class="row lstonly"><label style="width:52px">標籤字級%</label><input id="iLb" type="number" step=".05" style="width:78px"></div>
    <div class="row lstonly"><label style="width:52px">標籤字距</label><input id="iLls" type="number" step=".02" style="width:78px"></div>
    <div class="row lstonly"><label style="width:52px">行距</label><input id="iLh" type="number" step=".05" style="width:78px"><span style="color:#9a9081">倍</span></div>
    <div class="row lstonly"><label style="width:52px">標籤間距</label><input id="iCg" type="number" step=".05" style="width:78px"><span style="color:#9a9081">em</span></div>
    <div class="row lstonly"><label style="width:52px">成員字距</label><input id="iLs" type="number" step=".02" style="width:78px"><span style="color:#9a9081">em</span></div>
    <div class="row"><label style="width:52px">X%</label><input id="iX" type="number" step=".1" style="width:78px">
                     <label style="width:30px">Y%</label><input id="iY" type="number" step=".1" style="width:78px"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="bCopy">複製 JSON</button>
    <button id="bReset">還原預設</button><button id="bLoad">匯入 JSON</button><button id="bEmbed">回到內嵌版面</button>
  </div>
  <textarea id="out" readonly></textarea>
</aside>

function seed(){
  return DEFAULT.map(d=>{
    const a = d.ang * Math.PI/180;
    const cx = TAIJI.x + RADIUS*Math.sin(a)/SIZE;
    const cy = TAIJI.y - RADIUS*Math.cos(a)/SIZE;
    // 清單預設放在字沿圓心向外 130px 處，並夾在畫布內避免跑出去
    const cl = v => Math.max(.14, Math.min(.86, v));
    const lx = cl(TAIJI.x + (RADIUS+130)*Math.sin(a)/SIZE);
    const ly = cl(TAIJI.y - (RADIUS+130)*Math.cos(a)/SIZE);
    return {...d, x:cx, y:cy, size:.070, note2:{x:cx, y:cy+.055, size:.022}, list:{x:lx, y:ly, size:.026, lh:1.45, cg:.70, ls:.16, lb:.021, lls:0}};
  });
}

// 成員簡寫：九宮去尾數、九星去「天」、八門去「門」
function short(label, value, abbr){
  const parts = value.split('、');
  if(!abbr) return parts;
  if(label==='九宮') return parts.map(v=>v.replace(/[一二三四五六七八九]$/,''));
  if(label==='九星') return parts.map(v=>v.replace(/^天/,''));
  if(label==='八門') return parts.map(v=>v.replace(/門$/,''));
  return parts;
}

  const w = px*.78, bar = Math.max(2, px*.105), gap = px*.11, split = w*.20;
  return `<div class="gua" style="gap:${px*.22}px">` + g.map(t =>
    `<div class="t" style="gap:${gap}px">` + t.map(solid =>
      solid
        ? `<div style="width:${w}px;height:${bar}px;background:${cGua}"></div>`
        : `<div style="width:${w}px;height:${bar}px;display:flex"><i style="flex:1;background:${cGua}"></i><i style="width:${split}px"></i><i style="flex:1;background:${cGua}"></i></div>`
    ).join('') + `</div>`).join('') + `</div>`;
}

function render(){
  [...stage.querySelectorAll('.el')].forEach(e=>e.remove());
  const showList = document.getElementById('bList').classList.contains('on');
  items.forEach((it,i)=>{
    const px = it.size*SIZE;
    const g = document.createElement('div');
    g.className = 'el grp' + (sel===i+'g' ? ' sel' : '');
    g.dataset.id = i+'g';
    g.style.left = it.x*SIZE+'px'; g.style.top = it.y*SIZE+'px';
    g.style.transform = 'translate(-50%,-50%)';
    g.innerHTML = `<span class="ch" style="font-size:${px}px;color:${colors[i]};font-family:'${FONT_CSS[fontBig]}',serif">${it.n}</span>` + guaHTML(it.gua, px*.62);
    stage.appendChild(g);

    if(it.note){
      const N = document.createElement('div');
      N.className = 'el nt' + (sel===i+'n' ? ' sel' : '');
      N.dataset.id = i+'n';
      N.style.left = it.note2.x*SIZE+'px'; N.style.top = it.note2.y*SIZE+'px';
      N.style.transform = 'translate(-50%,-50%)';
      N.style.fontSize = it.note2.size*SIZE+'px';
      N.style.color = colors[i];
      N.style.fontFamily = `'${FONT_CSS[fontList]}',serif`;
      N.textContent = it.note;
      stage.appendChild(N);
    }

    if(showList){
      const L = document.createElement('div');
      L.className = 'el lst' + (sel===i+'l' ? ' sel' : '');
      L.dataset.id = i+'l';
      L.style.left = it.list.x*SIZE+'px'; L.style.top = it.list.y*SIZE+'px';
      L.style.transform = 'translate(-50%,-50%)';
      L.style.fontSize = it.list.size*SIZE+'px';
      L.style.fontFamily = `'${FONT_CSS[fontList]}',serif`;
      L.style.lineHeight = (it.list.lh ?? 1.45);
      L.style.columnGap  = (it.list.cg ?? .70)+'em';
      L.style.rowGap     = ((it.list.lh ?? 1.45)-1.25)+'em';
      const ls = (it.list.ls ?? 0), sep = document.getElementById('aSep').value;
      const abbr = document.getElementById('aAbbr').value === '1';
      const lb = (it.list.lb ?? it.list.size*.84) * SIZE;
      const lls = (it.list.lls ?? 0);
      L.style.color = cVal;
      L.innerHTML = it.rows.map(r=>
        `<b style="font-size:${lb}px;letter-spacing:${lls}em;margin-right:${-lls}em;color:${cLbl}">${r[0]}</b><span style="letter-spacing:${ls}em">${short(r[0], r[1], abbr).join(sep)}</span>`).join('');
      stage.appendChild(L);
    }
  });
  drawGuides(); table(); pane(); save();
}

function drawGuides(){
  const on = document.getElementById('bGuide').classList.contains('on');
  const cx = TAIJI.x*SIZE, cy = TAIJI.y*SIZE;
  if(!on){ guides.innerHTML=''; return; }
  const pts = items.map(it=>[it.x*SIZE, it.y*SIZE]);
  const pent = DEFAULT.map(d=>{
    const a=d.ang*Math.PI/180;
    return [cx+curR*Math.sin(a), cy-curR*Math.cos(a)];
  });
  guides.setAttribute('viewBox',`0 0 ${SIZE} ${SIZE}`);
  guides.setAttribute('width',SIZE); guides.setAttribute('height',SIZE);
  guides.innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="${curR}" fill="none" stroke="#9d2821" stroke-opacity=".45" stroke-dasharray="6 6"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${SIZE}" stroke="#9d2821" stroke-opacity=".25"/>
    <line x1="0" y1="${cy}" x2="${SIZE}" y2="${cy}" stroke="#9d2821" stroke-opacity=".25"/>
    <polygon points="${pent.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0a6" stroke-opacity=".4"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#0a6"/>`).join('')}
    <circle cx="${cx}" cy="${cy}" r="5" fill="#9d2821"/>`;
}

// 五組一起調
function syncAll(){
  const g=id=>+document.getElementById(id).value;
  items.forEach(it=>{ it.list.size=g('aSize')/100; it.list.lh=g('aLh'); it.list.cg=g('aCg'); it.list.ls=g('aLs'); it.list.lb=g('aLb')/100; it.note2.size=g('aNote')/100; it.list.lls=g('aLls'); it.size=g('aBig')/100; });
  render();
}
function applyRadius(){
  const R=+document.getElementById('aR').value;
  curR = R;
  items.forEach((it,i)=>{
    const a=DEFAULT[i].ang*Math.PI/180;
    const old={x:it.x,y:it.y};
    it.x=TAIJI.x+R*Math.sin(a)/SIZE; it.y=TAIJI.y-R*Math.cos(a)/SIZE;
    it.list.x+=it.x-old.x; it.list.y+=it.y-old.y;      // 清單跟著字一起平移
  });
  render();
}
['aSize','aNote','aLb','aLls','aLh','aCg','aLs','aBig'].forEach(id=>document.getElementById(id).addEventListener('input',syncAll));
document.getElementById('aR').addEventListener('input',applyRadius);
document.getElementById('aSep').addEventListener('change',render);
colors.forEach((_,i)=>document.getElementById('c'+i).addEventListener('input',e=>{colors[i]=e.target.value;render()}));
document.getElementById('cLbl').addEventListener('input',e=>{cLbl=e.target.value;render()});
document.getElementById('cVal').addEventListener('input',e=>{cVal=e.target.value;render()});
document.getElementById('cGua').addEventListener('input',e=>{cGua=e.target.value;render()});
for(const [id,key,unit] of [['tSat','sat','%'],['tBri','bri','%'],['tHue','hue','°'],['tOpa','opa','%'],['tFea','fea','px']])
  document.getElementById(id).addEventListener('input',e=>{
    tone[key]=+e.target.value;
    document.getElementById('v'+id.slice(1)).textContent=e.target.value+unit;
    applyTone(); });
document.querySelectorAll('.stp').forEach(btn => btn.addEventListener('click', () => {
  const el = document.getElementById(btn.dataset.t);
  const step = +(el.step || 1) || 1;
  el.value = Math.max(+el.min, Math.min(+el.max, +el.value + step * +btn.dataset.d));
  el.dispatchEvent(new Event('input', {bubbles:true}));
}));

function applyTone(){
  // 透明度用 opacity 疊在紙色底上呈現，與產圖時「往紙色混合」等價
  const bg = document.getElementById('bgLayer');
  bg.style.setProperty('--tone',
    `saturate(${tone.sat}%) brightness(${tone.bri}%) hue-rotate(${tone.hue}deg) opacity(${tone.opa}%)`);
  const f = tone.fea;
  if(f > 0){
    const g = d => `linear-gradient(to ${d}, transparent 0, #000 ${f}px, #000 calc(100% - ${f}px), transparent 100%)`;
    bg.style.webkitMaskImage = `${g('right')},${g('bottom')}`;
    bg.style.webkitMaskComposite = 'source-in';
    bg.style.maskImage = `${g('right')},${g('bottom')}`;
    bg.style.maskComposite = 'intersect';
  } else {
    bg.style.webkitMaskImage = bg.style.maskImage = 'none';
  }
}
document.getElementById('aFontBig').addEventListener('change',e=>{fontBig=e.target.value;render()});
document.getElementById('aFontList').addEventListener('change',e=>{fontList=e.target.value;render()});
document.getElementById('aAbbr').addEventListener('change',render);

function pane(){
  const box=document.getElementById('pane');
  if(!sel){ box.style.display='none'; return; }
  box.style.display='block';
  const isL = sel[1]==='l', o = ref(sel), it = items[+sel[0]];
  document.getElementById('paneName').textContent = it.n + (isL ? ' 清單' : ' 字組');
  [...document.querySelectorAll('.lstonly')].forEach(e=>e.style.display = isL ? 'flex' : 'none');
  iSize.value=(o.size*100).toFixed(2); iX.value=(o.x*100).toFixed(2); iY.value=(o.y*100).toFixed(2);
  if(isL){ iLh.value=(o.lh ?? 1.45).toFixed(2); iCg.value=(o.cg ?? .70).toFixed(2); iLs.value=(o.ls ?? 0).toFixed(2); iLb.value=((o.lb ?? o.size*.84)*100).toFixed(2); iLls.value=(o.lls ?? 0).toFixed(2); }
}
for(const [id,key,sc] of [['iSize','size',100],['iX','x',100],['iY','y',100],['iLh','lh',1],['iCg','cg',1],['iLs','ls',1],['iLb','lb',100],['iLls','lls',1]])
  document.addEventListener('input', e=>{
    if(e.target.id!==id || !sel) return;
    ref(sel)[key] = (+e.target.value)/sc; render();
  });

function table(){
  const cx=TAIJI.x*SIZE, cy=TAIJI.y*SIZE;
  document.getElementById('tb').innerHTML = items.map((it,i)=>{
    const d = Math.hypot(it.x*SIZE-cx, it.y*SIZE-cy);
    const a = `<tr class="${sel===i+'g'?'sel':''}"><td>${it.n}</td><td>${(it.x*100).toFixed(2)}</td><td>${(it.y*100).toFixed(2)}</td><td>${(it.size*100).toFixed(2)}</td><td>${d.toFixed(0)}</td></tr>`;
    const dn = Math.hypot(it.note2.x*SIZE-cx, it.note2.y*SIZE-cy);
    const c = `<tr class="${sel===i+'n'?'sel':''}"><td style="padding-left:14px;color:#9a9081">${it.n} 註解</td><td>${(it.note2.x*100).toFixed(2)}</td><td>${(it.note2.y*100).toFixed(2)}</td><td>${(it.note2.size*100).toFixed(2)}</td><td>${dn.toFixed(0)}</td></tr>`;
    const dl = Math.hypot(it.list.x*SIZE-cx, it.list.y*SIZE-cy);
    const b = `<tr class="${sel===i+'l'?'sel':''}"><td style="padding-left:14px;color:#9a9081">${it.n} 清單</td><td>${(it.list.x*100).toFixed(2)}</td><td>${(it.list.y*100).toFixed(2)}</td><td>${(it.list.size*100).toFixed(2)}</td><td>${dl.toFixed(0)}</td></tr>`;
    return a+c+b;
  }).join('');
  document.getElementById('out').value = JSON.stringify({
    canvas:SIZE, taiji:TAIJI, radius:curR, fontBig, fontList, colors, cLbl, cVal, cGua, tone, sep:document.getElementById('aSep').value, abbr:document.getElementById('aAbbr').value==='1',
    items: items.map(it=>({name:it.n, x:+it.x.toFixed(5), y:+it.y.toFixed(5), size:+it.size.toFixed(5),
                           note:{x:+it.note2.x.toFixed(5), y:+it.note2.y.toFixed(5), size:+it.note2.size.toFixed(5)},
                           list:{x:+it.list.x.toFixed(5), y:+it.list.y.toFixed(5), size:+it.list.size.toFixed(5),
                                 lb:+(it.list.lb ?? it.list.size*.84).toFixed(5),
                                 lh:+(it.list.lh ?? 1.45).toFixed(3),
                                 cg:+(it.list.cg ?? .70).toFixed(3),
                                 ls:+(it.list.ls ?? .16).toFixed(3),
                                 lls:+(it.list.lls ?? 0).toFixed(3)}}))
  }, null, 2);
}
function save(){
  localStorage.setItem('wuxing-state', JSON.stringify(
    {ver:SAVED_VER, items, fontBig, fontList, colors, cLbl, cVal, cGua, tone, curR,
     sep:document.getElementById('aSep').value,
     abbr:document.getElementById('aAbbr').value}));
}

function ref(id){ const i=+id[0]; return id[1]==='g' ? items[i] : id[1]==='n' ? items[i].note2 : items[i].list; }

// ---- 拖曳 ----
let drag=null;
stage.addEventListener('pointerdown', e=>{
  const el = e.target.closest('.el'); if(!el) { sel=null; render(); return; }
  sel = el.dataset.id;
  const k = +stage.dataset.k, o = ref(sel);
  drag = {sx:e.clientX, sy:e.clientY, ox:o.x, oy:o.y, k};
  el.setPointerCapture(e.pointerId); render();
});
stage.addEventListener('pointermove', e=>{
  if(!drag) return;
  const o = ref(sel);
  o.x = drag.ox + (e.clientX-drag.sx)/drag.k/SIZE;
  o.y = drag.oy + (e.clientY-drag.sy)/drag.k/SIZE;
  if(document.getElementById('bSnap').classList.contains('on') && sel[1]==='g'){
    const cx=TAIJI.x, cy=TAIJI.y;
    const d = Math.hypot((o.x-cx)*SIZE,(o.y-cy)*SIZE);
    if(Math.abs(d-curR) < 14){                       // 吸附到等距圓
      const a = Math.atan2(o.x-cx, -(o.y-cy));
      o.x = cx + curR*Math.sin(a)/SIZE; o.y = cy - curR*Math.cos(a)/SIZE;
    }
  }
  render();
});
addEventListener('pointerup', ()=> drag=null);

// ---- 滾輪縮放 ----
stage.addEventListener('wheel', e=>{
  const el = e.target.closest('.el'); if(!el) return;
  e.preventDefault();
  const o = ref(el.dataset.id);
  o.size = Math.max(.012, Math.min(.30, o.size * (e.deltaY>0 ? .95 : 1.0526)));
  sel = el.dataset.id; render();
}, {passive:false});

// ---- 鍵盤 ----
addEventListener('keydown', e=>{
  if(e.key==='Escape'){ sel=null; render(); return; }
  if(!sel) return;
  const o = ref(sel), step = (e.shiftKey?10:1)/SIZE;
  if(e.key==='ArrowLeft')  o.x-=step; else if(e.key==='ArrowRight') o.x+=step;
  else if(e.key==='ArrowUp') o.y-=step; else if(e.key==='ArrowDown') o.y+=step;
  else if(e.key==='[') o.size*=.96; else if(e.key===']') o.size*=1.0417;
  else return;
  e.preventDefault(); render();
});

// ---- 按鈕 ----
for(const id of ['bGuide','bSnap','bList'])
  document.getElementById(id).onclick = e => { e.target.classList.toggle('on'); render(); };
document.getElementById('bCopy').onclick = () => {
  navigator.clipboard.writeText(document.getElementById('out').value);
  const b=document.getElementById('bCopy'); b.textContent='已複製'; setTimeout(()=>b.textContent='複製 JSON',1200);
};
document.getElementById('bLoad').onclick = () => {
  const raw = prompt('把匯出的 JSON 貼進來：');
  if(raw && loadState(raw)){ fillPanel(); applyTone(); render(); }
};
document.getElementById('bEmbed').onclick = () => {
  localStorage.removeItem('wuxing-state');
  loadState(SAVED); fillPanel(); applyTone(); sel=null; render();
};
document.getElementById('bReset').onclick = () => { items = seed(); curR = RADIUS; sel=null; fillPanel(); render(); };

function fillPanel(){
  const same = f => { const v = items.map(f); return v.every(x => x === v[0]) ? v[0] : ''; };
  const set = (id, v) => { const e = document.getElementById(id); if (e && v !== '') e.value = v; };
  set('aSize',  (same(i=>i.list.size)*100 || '').toFixed ? (same(i=>i.list.size)*100).toFixed(2) : '');
  set('aNote', (same(i=>i.note2.size)*100).toFixed(2));
  set('aLb',    (same(i=>i.list.lb ?? i.list.size*.84)*100).toFixed(2));
  set('aLls',   same(i=>i.list.lls ?? 0));
  set('aLh',    same(i=>i.list.lh ?? 1.45));
  set('aCg',    same(i=>i.list.cg ?? .70));
  set('aLs',    same(i=>i.list.ls ?? .16));
  set('aBig',   (same(i=>i.size)*100).toFixed(2));
  set('aR',     Math.round(curR));
  set('aFontBig', fontBig); set('aFontList', fontList);
  colors.forEach((c,i)=>set('c'+i,c));
  set('cLbl',cLbl); set('cVal',cVal); set('cGua',cGua);
  for(const [id,key] of [['tSat','sat'],['tBri','bri'],['tOpa','opa'],['tFea','fea'],['tHue','hue']]){
    set(id, tone[key]);
    const lab=document.getElementById('v'+id.slice(1));
    if(lab) lab.textContent = tone[key] + (key==='hue' ? '°' : key==='fea' ? 'px' : '%');
  }
}

function loadState(raw){
  try{
    const st = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if(!st) return false;
    const src = st.items || st;                       // 支援匯出的 JSON 或內部存檔
    const byName = Object.fromEntries(src.map(i=>[i.name || i.n, i]));
    items = seed().map(it => {
      const m = byName[it.n]; if(!m) return it;
      return {...it, x:m.x ?? it.x, y:m.y ?? it.y, size:m.size ?? it.size,
              list:{...it.list, ...(m.list||{})}, note2:{...it.note2, ...(m.note||{})}};
    });
    if(st.fontBig)  fontBig  = st.fontBig;
    if(st.fontList) fontList = st.fontList;
    if(st.colors)   colors   = st.colors;
    if(st.cLbl) cLbl = st.cLbl; if(st.cVal) cVal = st.cVal; if(st.cGua) cGua = st.cGua;
    if(st.tone) tone = {...tone, ...st.tone};
    if(st.radius || st.curR) curR = st.radius || st.curR;
    if(st.sep !== undefined) document.getElementById('aSep').value = st.sep;
    if(st.abbr !== undefined) document.getElementById('aAbbr').value = (st.abbr === true || st.abbr === '1') ? '1' : '0';
    return true;
  }catch(e){ alert('JSON 讀取失敗：' + e.message); return false; }
}

(() => {
  let st = null;
  try { st = JSON.parse(localStorage.getItem('wuxing-state') || 'null'); } catch(e) {}
  if (st && st.ver === SAVED_VER) loadState(st);       // 快取與內嵌同版才續用
  else { loadState(SAVED); localStorage.removeItem('wuxing-state'); }
})();
fillPanel(); applyTone(); fit(); render();
</script>
